<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Mallas Curriculares</title>
<style>
  :root {
    --bg-1: #071826;
    --bg-2: #0d2436;
    --surface: #0f2c40;
    --surface-hover: #123753;
    --ink: #eef6f5;
    --muted: #7ea3ac;
    --accent: #4fd8c4;
    --accent-soft: rgba(79, 216, 196, 0.14);
    --ring: rgba(79, 216, 196, 0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(79,216,196,0.07), transparent 40%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 65%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 20px;
    line-height: 1.6;
  }

  /* fondo tipo malla / grilla, muy sutil */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 72%);
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 72%);
  }

  .page {
    position: relative;
    width: 100%;
    max-width: 560px;
  }

  header {
    margin-bottom: 44px;
  }

  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: clamp(28px, 5vw, 36px);
    font-weight: 500;
    letter-spacing: -0.3px;
    margin: 0 0 10px;
  }

  header p {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
    max-width: 40ch;
  }

  .path {
    position: relative;
    padding-left: 30px;
  }

  .path::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 12px;
    bottom: 12px;
    width: 2px;
    background: linear-gradient(var(--accent), rgba(79,216,196,0.05));
    opacity: 0.55;
  }

  .node {
    position: relative;
    margin-bottom: 16px;
  }
  .node:last-child { margin-bottom: 0; }

  .node .dot {
    position: absolute;
    left: -30px;
    top: 26px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
    transform: translateY(-50%);
  }

  .stop {
    display: block;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 18px 20px;
    text-decoration: none;
    color: var(--ink);
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }

  .stop:hover,
  .stop:focus-visible {
    background: var(--surface-hover);
    border-color: rgba(79,216,196,0.35);
    transform: translateX(3px);
  }

  .stop:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .tag {
    display: inline-block;
    font-size: 11.5px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 9px;
  }

  .stop strong {
    display: block;
    font-size: 16.5px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .stop .desc {
    display: block;
    font-size: 13px;
    color: var(--muted);
  }

  footer {
    margin-top: 46px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 420px) {
    .stop { padding: 16px; }
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <h1>Elige tu malla curricular</h1>
    <p>Selecciona la versión que quieres consultar.</p>
  </header>

    <div class="node">
      <span class="dot"></span>
      <a href="malla_curricular_interactiva.html" class="stop">
        <span class="tag">Interactiva</span>
        <strong>Malla Curricular Interactiva</strong>
        <span class="desc">Con avance, requisitos y gráficos</span>
      </a>
    </div>

    <div class="node">
      <span class="dot"></span>
      <a href="MallaPPA.html" class="stop">
        <span class="tag">PPA</span>
        <strong>Malla — Plan de Progreso Académico</strong>
        <span class="desc">Seguimiento de avance PPA</span>
      </a>
    </div>
  </div>
</div>

</body>
</html>
